# Release workflow for mim (the morloc installation manager) and its in-env
# dependency agent mim-env.
#
# Triggered by pushing a version tag:
#   git tag v0.26.0 && git push origin v0.26.0
#
# Produces fully static musl binaries on Linux (run on any Linux, including NixOS
# and minimal containers) and native binaries on macOS-arm64, plus a SHA-256 for
# every asset. mim/mim-env are pure-Rust with no native dependencies, so the musl
# target links fully static.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-

      - name: Build mim + mim-env
        run: cargo build --release --target ${{ matrix.target }} -p mim -p mim-env

      - name: Stage, strip, verify, checksum
        run: |
          mkdir -p out
          for bin in mim mim-env; do
            src="target/${{ matrix.target }}/release/$bin"
            dst="out/${bin}-${{ matrix.platform }}"
            cp "$src" "$dst"
            strip "$dst" || true
            # The Linux binaries must be fully static (no dynamic loader), so they
            # run on any Linux the manager might install morloc onto.
            if [ "${{ runner.os }}" = "Linux" ]; then
              file "$dst"
              if ldd "$dst" 2>&1 | grep -q "=>"; then
                echo "ERROR: $dst is not statically linked" >&2
                exit 1
              fi
            fi
            ( cd out && sha256sum "${bin}-${{ matrix.platform }}" > "${bin}-${{ matrix.platform }}.sha256" )
          done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: mim-${{ matrix.platform }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'mim-*'
          merge-multiple: true
          path: dist

      - name: List assets
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mim-*
          generate_release_notes: true
