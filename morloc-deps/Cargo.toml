[package]
name = "morloc-deps"
version.workspace = true
edition.workspace = true
description = "Dependency-resolution kernel shared by mim and mim-env"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = { workspace = true }
pem = "3"
x509-parser = "0.16"
# flock(2) advisory locking (the `fs` feature) to serialize concurrent solves
# against one environment's shared pixi prefix.
nix = { workspace = true }

[dev-dependencies]
tempfile = "3"
