[package]
name = "mim"
version.workspace = true
edition.workspace = true
description = "Morloc installation and environment manager"

[[bin]]
name = "mim"
path = "src/main.rs"

[dependencies]
morloc-deps = { path = "../morloc-deps" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
nix = { workspace = true }
clap = { workspace = true }
anstream = "1"
thiserror = { workspace = true }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
inquire = "0.9"

[dev-dependencies]
tempfile = "3"
